services:
  - type: web
    name: yanki-sesli-sohbet
    runtime: node
    plan: free
    rootDir: yanki-dagitim
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: yanki-db
          property: connectionString
databases:
  - name: yanki-db
    plan: free
    databaseName: yanki
    user: yanki

