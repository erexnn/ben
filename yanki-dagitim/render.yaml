services:
  - type: web
    name: yanki-sesli-sohbet
    runtime: node
    plan: free
    rootDir: yanki-dagitim
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: yanki-db
          property: connectionString
      - key: EMAIL_CODE_SECRET
        generateValue: true
      - key: GMAIL_USER
        sync: false
      - key: GMAIL_APP_PASSWORD
        sync: false
